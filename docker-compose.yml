version: "3.9"

services:
  web:
    build:
      context: .
      args:
        SEMANTIC_MODEL_NAME: paraphrase-multilingual-MiniLM-L12-v2
    env_file:
      - .env.docker
    environment:
      WARMUP_ON_START: "0"
      APP_DB_HOST: db
      PORTAL_DB_HOST: portal_db
    ports:
      - "8000:8000"
    depends_on:
      - db
      - portal_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/upload/"]
      interval: 30s
      timeout: 10s
      retries: 5
    # To use an offline model mount, see docker-compose.offline.yml.

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - app_db_data:/var/lib/postgresql/data

  portal_db:
    image: postgres:15
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - portal_db_data:/var/lib/postgresql/data

volumes:
  app_db_data:
  portal_db_data:
