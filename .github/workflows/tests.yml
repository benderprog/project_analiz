name: Django tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      APP_DB_NAME: app_db
      APP_DB_USER: app
      APP_DB_PASSWORD: app
      APP_DB_HOST: 127.0.0.1
      APP_DB_PORT: "5432"
      PORTAL_DB_NAME: portal_db
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: portal
      PORTAL_DB_HOST: 127.0.0.1
      PORTAL_DB_PORT: "5432"
      SEMANTIC_MODEL_NAME: paraphrase-multilingual-MiniLM-L12-v2
      SKIP_SEMANTIC_MODEL: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database roles and schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app LOGIN PASSWORD 'app' CREATEDB;
          CREATE ROLE portal LOGIN PASSWORD 'portal' CREATEDB;
          CREATE DATABASE app_db OWNER app;
          CREATE DATABASE portal_db OWNER portal;
          SQL

      - name: Run migrations
        run: |
          python manage.py migrate
          python manage.py migrate --database=portal

      - name: Run tests
        run: python manage.py test
