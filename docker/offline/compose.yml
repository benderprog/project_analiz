version: "3.9"

services:
  db_app:
    image: postgres:15
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  portal_db_test:
    image: postgres:15
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: ${PORTAL_DB_NAME}
      POSTGRES_USER: ${PORTAL_DB_USER}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD}
      TZ: UTC
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  restore_app:
    image: postgres:15
    depends_on:
      db_app:
        condition: service_healthy
    volumes:
      - ./db_dumps:/db_dumps:ro
    environment:
      - PGPASSWORD=${APP_DB_PASSWORD}
    command:
      - sh
      - -lc
      - pg_restore -h db_app -p 5432 -U ${APP_DB_USER} -d ${APP_DB_NAME} --clean --if-exists --no-owner --no-privileges /db_dumps/app_db.dump
    restart: "no"

  restore_portal:
    image: postgres:15
    depends_on:
      portal_db_test:
        condition: service_healthy
    volumes:
      - ./db_dumps:/db_dumps:ro
    environment:
      - PGPASSWORD=${PORTAL_DB_PASSWORD}
    command:
      - sh
      - -lc
      - pg_restore -h portal_db_test -p 5432 -U ${PORTAL_DB_USER} -d ${PORTAL_DB_NAME} --clean --if-exists --no-owner --no-privileges /db_dumps/portal_db_test.dump
    restart: "no"

  migrate_app:
    image: project_analiz:web-ver-${VERSION}
    env_file:
      - .env
    volumes:
      - ../configs:/app/configs:ro
      - ./models:/opt/models:ro
    depends_on:
      db_app:
        condition: service_healthy
    command: ["python", "manage.py", "migrate"]
    restart: "no"

  migrate_portal:
    image: project_analiz:web-ver-${VERSION}
    env_file:
      - .env
    volumes:
      - ../configs:/app/configs:ro
      - ./models:/opt/models:ro
    depends_on:
      portal_db_test:
        condition: service_healthy
    command: ["python", "manage.py", "migrate", "--database=portal"]
    restart: "no"

  web:
    image: project_analiz:web-ver-${VERSION}
    env_file:
      - .env
    volumes:
      - ../configs:/app/configs:ro
      - ./models:/opt/models:ro
    depends_on:
      db_app:
        condition: service_healthy
      portal_db_test:
        condition: service_healthy
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  app_db_data:
  portal_db_data:
