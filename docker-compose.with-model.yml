version: "3.9"

services:
  web:
    build:
      context: .
      args:
        INCLUDE_MODEL: "1"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WARMUP_ON_START: "0"
      SEMANTIC_MODEL_PATH: ${SEMANTIC_MODEL_PATH:-/opt/models/paraphrase-multilingual-MiniLM-L12-v2}
